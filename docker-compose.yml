services:
  db:
    image: postgres:15-alpine
    container_name: codequest_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: codequest_db
      POSTGRES_USER: codequest_user
      POSTGRES_PASSWORD: codequest_password
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: codequest_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.base
      - POSTGRES_DB=codequest_db
      - POSTGRES_USER=codequest_user
      - POSTGRES_PASSWORD=codequest_password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data:
