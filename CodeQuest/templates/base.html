<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CodeQuest | Ingeniería de Software Gamificada{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
        }
        .font-mono-code {
            font-family: 'JetBrains Mono', monospace;
        }
        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .animate-shake {
            animation: shakeError 0.45s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100 selection:bg-cyan-500 selection:text-slate-950">

    {% if estudiante %}
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-6 py-3.5 flex items-center justify-between">
            <a href="{% url 'skill_tree_view' %}" class="flex items-center gap-3 group">
                <span class="w-9 h-9 rounded-lg bg-cyan-500/10 border border-cyan-500/40 flex items-center justify-center text-cyan-400 font-mono-code font-bold group-hover:bg-cyan-500/20 transition">
                    CQ
                </span>
                <div>
                    <span class="font-bold text-lg tracking-tight text-white">CodeQuest</span>
                    <span class="block text-xs text-slate-400 font-mono-code">ISO/IEC 29110 // DREAM TEAM</span>
                </div>
            </a>

            <div class="flex items-center gap-6">
                <div class="flex items-center gap-2 bg-slate-800/90 border border-cyan-500/30 px-3.5 py-1.5 rounded-full">
                    <span class="text-amber-400 text-sm">⚡</span>
                    <span class="font-mono-code text-xs uppercase text-slate-400">XP Total:</span>
                    <span id="header-xp-counter" class="font-mono-code font-bold text-cyan-400 text-sm">{{ puntaje_total|default:0 }}</span>
                </div>

                <div class="text-right hidden sm:block">
                    <p class="text-sm font-medium text-slate-200">{{ estudiante.nombre }}</p>
                    <p class="text-xs font-mono-code text-slate-400">{{ estudiante.correo }}</p>
                </div>

                <a href="{% url 'logout_view' %}" onclick="localStorage.removeItem('cq_access_token'); localStorage.removeItem('cq_refresh_token');"
                   class="text-xs font-mono-code px-3 py-2 rounded-lg border border-rose-500/40 text-rose-300 hover:bg-rose-500/10 transition">
                    Cerrar Sesión
                </a>
            </div>
        </div>
    </header>
    {% endif %}

    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-slate-900 py-4 text-center text-xs text-slate-500 font-mono-code">
        CodeQuest • Ingeniería de Software UAZ
    </footer>
</body>
</html>
